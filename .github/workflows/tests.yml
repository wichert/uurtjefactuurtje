name: Tests

on:
  push:
    branches-ignore: [main]

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: SwiftLint
        uses: cirruslabs/swiftlint-action@v1
        with:
          version: "0.65.1"

  unit:
    name: Unit tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: LibraryStore tests
        run: swift test

  app:
    name: Application tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: App tests
        run: |
          xcodebuild test \
            -project UurtjeFactuurtje.xcodeproj \
            -scheme UurtjeFactuurtje \
            -destination 'platform=macOS'
