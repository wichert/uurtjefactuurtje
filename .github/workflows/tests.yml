name: Tests

on:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Run tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --quiet --reporter github-actions-logging

      - name: LibraryStore tests
        run: swift test

      - name: App tests
        run: |
          xcodebuild test \
            -project UurtjeFactuurtje.xcodeproj \
            -scheme UurtjeFactuurtje \
            -destination 'platform=macOS'
