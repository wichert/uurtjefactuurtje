name: Tests

on:
  push:
    branches-ignore: [main]

jobs:
  unit:
    name: Lint
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: SwiftLint
        users: cirruslabs/swiftlint-action@v1
        with:
          version: "0.65.1"


  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: LibraryStore tests
        run: swift test


  app:
    name: Application tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: App tests
        run: |
          xcodebuild test \
            -project UurtjeFactuurtje.xcodeproj \
            -scheme UurtjeFactuurtje \
            -destination 'platform=macOS'
